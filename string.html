<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>String Variables and Properties</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom CSS to ensure Inter font is applied */
      body {
        font-family: "Inter", sans-serif;
        background-color: #f0f4f8; /* Light gray background */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background-color: #ffffff;
        padding: 2.5rem; /* Increased padding */
        border-radius: 1.5rem; /* More rounded corners */
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05); /* Softer shadow */
        max-width: 90%;
        width: 500px; /* Fixed width for better presentation on desktop */
        text-align: left;
      }
      .string-display {
        background-color: #e2e8f0; /* Lighter gray background for string display */
        padding: 0.75rem 1rem;
        border-radius: 0.5rem; /* Rounded corners for individual string displays */
        margin-bottom: 0.75rem; /* Spacing between string displays */
        word-wrap: break-word; /* Ensure long strings wrap */
      }
      .string-display:last-child {
        margin-bottom: 0; /* No margin for the last element within a section */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        String Variable Showcase
      </h1>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >myString:</label
        >
        <div id="myStringDisplay" class="string-display text-gray-900"></div>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >anotherString (with leading spaces):</label
        >
        <div
          id="anotherStringDisplay"
          class="string-display text-gray-900"
        ></div>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >hello:</label
        >
        <div id="helloDisplay" class="string-display text-gray-900"></div>
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >myName:</label
        >
        <div id="myNameDisplay" class="string-display text-gray-900"></div>
      </div>

      <h2
        class="text-2xl font-bold text-gray-800 mb-4 text-center border-t pt-4"
      >
        myString Properties
      </h2>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >Length of myString:</label
        >
        <div
          id="myStringLengthDisplay"
          class="string-display text-gray-900"
        ></div>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >First character of myString:</label
        >
        <div
          id="myStringFirstCharDisplay"
          class="string-display text-gray-900"
        ></div>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >11th character of myString:</label
        >
        <div
          id="myStringEleventhCharDisplay"
          class="string-display text-gray-900"
        ></div>
      </div>

      <h2
        class="text-2xl font-bold text-gray-800 mb-4 text-center border-t pt-4"
      >
        String Manipulation
      </h2>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >Slice "is a" from myString:</label
        >
        <div
          id="slicedStringDisplay"
          class="string-display text-gray-900"
        ></div>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >Substring "the" from anotherString:</label
        >
        <div id="subStringDisplay" class="string-display text-gray-900"></div>
      </div>

      <h2
        class="text-2xl font-bold text-gray-800 mb-4 text-center border-t pt-4"
      >
        myName Case Conversion
      </h2>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >myName (Uppercase):</label
        >
        <div
          id="myNameUpperCaseDisplay"
          class="string-display text-gray-900"
        ></div>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2"
          >myName (Lowercase):</label
        >
        <div
          id="myNameLowerCaseDisplay"
          class="string-display text-gray-900"
        ></div>
      </div>
    </div>

    <script>
      // JavaScript code starts here

      // Define the string variables
      const myString = "This is a string";
      const anotherString = "   Another string"; // Note: 3 blank spaces at the beginning
      const hello = "Hello there!";

      // Prompt the user for their first name
      let myName = "";
      function showNamePrompt() {
        const promptBox = document.createElement("div");
        promptBox.id = "namePromptBox";
        promptBox.className =
          "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50";
        promptBox.innerHTML = `
                <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
                    <h2 class="text-xl font-bold mb-4 text-gray-800">Enter Your First Name</h2>
                    <input type="text" id="nameInput" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" placeholder="e.g., John">
                    <button id="submitName" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">Submit</button>
                </div>
            `;
        document.body.appendChild(promptBox);

        document.getElementById("submitName").addEventListener("click", () => {
          const nameInput = document.getElementById("nameInput");
          myName = nameInput.value.trim(); // Get the value and trim whitespace
          if (myName === "") {
            myName = "Guest"; // Default if no name is entered
          }
          document.body.removeChild(promptBox);
          updateDisplay(); // Update the display once name is entered
        });

        // Focus on the input field
        setTimeout(() => {
          document.getElementById("nameInput").focus();
        }, 100);
      }

      // Function to update the display elements
      function updateDisplay() {
        // Get references to the HTML elements where strings will be displayed
        const myStringDisplay = document.getElementById("myStringDisplay");
        const anotherStringDisplay = document.getElementById(
          "anotherStringDisplay"
        );
        const helloDisplay = document.getElementById("helloDisplay");
        const myNameDisplay = document.getElementById("myNameDisplay");

        // Set the text content of the HTML elements
        myStringDisplay.textContent = myString;
        anotherStringDisplay.textContent = anotherString;
        helloDisplay.textContent = hello;
        myNameDisplay.textContent = myName;

        // --- String Properties ---
        // Calculate length of myString
        const myStringLength = myString.length;
        // Get the first character (index 0)
        const myStringFirstChar = myString[0];
        // Get the 11th character (index 10, because string indices are zero-based)
        const myStringEleventhChar = myString[10];

        // Get references to the new HTML elements for properties
        const myStringLengthDisplay = document.getElementById(
          "myStringLengthDisplay"
        );
        const myStringFirstCharDisplay = document.getElementById(
          "myStringFirstCharDisplay"
        );
        const myStringEleventhCharDisplay = document.getElementById(
          "myStringEleventhCharDisplay"
        );

        // Display the calculated properties
        myStringLengthDisplay.textContent = myStringLength;
        myStringFirstCharDisplay.textContent = myStringFirstChar;
        myStringEleventhCharDisplay.textContent = myStringEleventhChar;

        // --- String Manipulation ---
        // Slice "is a" from myString
        // "This is a string"
        // Indices:    0123456789...
        // Characters: T h i s   i s   a   s t r i n g
        // "is a" starts at index 5 and ends before index 9.
        const slicedIsA = myString.slice(5, 9);

        // Use substring to get "the" from anotherString
        // "   Another string"
        // Indices:      01234567890123...
        // Characters:   _ _ _ A n o t h e r _ s t r i n g
        // "the" starts at index 10 and ends before index 13.
        const subStringThe = anotherString.substring(10, 13);

        // Get references to the new HTML elements for manipulation results
        const slicedStringDisplay = document.getElementById(
          "slicedStringDisplay"
        );
        const subStringDisplay = document.getElementById("subStringDisplay");

        // Display the manipulated strings
        slicedStringDisplay.textContent = slicedIsA;
        subStringDisplay.textContent = subStringThe;

        // --- myName Case Conversion ---
        // Convert myName to uppercase
        const myNameUpperCase = myName.toUpperCase();
        // Convert myName to lowercase
        const myNameLowerCase = myName.toLowerCase();

        // Get references to the new HTML elements for case conversion
        const myNameUpperCaseDisplay = document.getElementById(
          "myNameUpperCaseDisplay"
        );
        const myNameLowerCaseDisplay = document.getElementById(
          "myNameLowerCaseDisplay"
        );

        // Display the case-converted strings
        myNameUpperCaseDisplay.textContent = myNameUpperCase;
        myNameLowerCaseDisplay.textContent = myNameLowerCase;
      }

      // Call the function to show the name prompt when the page loads
      window.onload = showNamePrompt;

      // JavaScript code ends here
    </script>
  </body>
</html>
