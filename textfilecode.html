<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write Text File</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom CSS to ensure Inter font is applied */
      body {
        font-family: "Inter", sans-serif;
        background-color: #f0f4f8; /* Light gray background */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
      }
      .container {
        background-color: #ffffff;
        padding: 2.5rem; /* Increased padding */
        border-radius: 1.5rem; /* More rounded corners */
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05); /* Softer shadow */
        max-width: 90%;
        width: 500px;
        text-align: center;
      }
      .button {
        @apply bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-colors duration-200 text-lg font-semibold;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .message-box {
        background-color: #fff;
        border-radius: 0.75rem;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        padding: 1.5rem;
        width: 90%;
        max-width: 400px;
        z-index: 1000;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      .message-box.show {
        opacity: 1;
        visibility: visible;
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        display: none;
      }
      .overlay.show {
        display: block;
      }
      .content-display {
        background-color: #e2e8f0;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1.5rem;
        text-align: left;
        white-space: pre-wrap; /* Preserves whitespace and line breaks */
        font-family: monospace; /* Monospace font for code/text display */
        color: #333;
        border: 1px solid #cbd5e0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-3xl font-bold text-gray-800 mb-6">Write to output.txt</h1>

      <p class="text-gray-700 mb-4">
        The following string will be saved to
        <span class="font-semibold text-blue-600">output.txt</span>:
      </p>

      <div id="stringContentDisplay" class="content-display"></div>

      <button id="writeTextFileBtn" class="button">Write 'output.txt'</button>

      <p class="text-xs text-gray-600 mt-4">
        (This will trigger a download in your browser, simulating a file save.)
      </p>
    </div>

    <!-- Custom Message Box -->
    <div id="messageBox" class="message-box">
      <p id="messageText" class="text-lg text-gray-800 mb-4 text-center"></p>
      <div id="messageButtons" class="flex justify-center space-x-4">
        <button id="messageBoxOk" class="button">OK</button>
      </div>
    </div>
    <div id="overlay" class="overlay"></div>

    <script>
      // JavaScript code starts here

      // The string content to be saved to the text file
      const fileContent = `Hello there!
This is a demonstration of writing a string to a text file
in a web browser environment.

This file is named 'output.txt'.`;

      // Function to show a custom message box.
      // Replaces alert() and confirm() for better UI and iframe compatibility.
      function showMessageBox(message, onOk = null) {
        const messageBox = document.getElementById("messageBox");
        const messageText = document.getElementById("messageText");
        const messageBoxOk = document.getElementById("messageBoxOk");
        const overlay = document.getElementById("overlay");

        messageText.textContent = message;

        // Remove previous event listeners
        const oldOkListener = messageBoxOk.onclick;
        if (oldOkListener) {
          messageBoxOk.removeEventListener("click", oldOkListener);
        }

        messageBoxOk.onclick = () => {
          messageBox.classList.remove("show");
          overlay.classList.remove("show");
          if (onOk) {
            onOk();
          }
        };
        messageBoxOk.addEventListener("click", messageBoxOk.onclick);

        messageBox.classList.add("show");
        overlay.classList.add("show");
      }

      /**
       * Function to save the predefined string to a text file named 'output.txt'
       * by triggering a browser download.
       */
      function writeTextFile() {
        const filename = "output.txt";

        try {
          // 1. Create a Blob object from the string content
          const blob = new Blob([fileContent], {
            type: "text/plain;charset=utf-8",
          });

          // 2. Create a temporary URL for the Blob
          const url = URL.createObjectURL(blob);

          // 3. Create a temporary <a> element
          const a = document.createElement("a");
          a.href = url;
          a.download = filename; // Set the desired filename for download

          // 4. Programmatically click the <a> element to trigger download
          document.body.appendChild(a); // Temporarily add to DOM
          a.click();
          document.body.removeChild(a); // Remove after click

          // 5. Revoke the object URL to free up memory (important for performance)
          // Use a slight delay to ensure the download has started before revoking
          setTimeout(() => {
            URL.revokeObjectURL(url);
          }, 100);

          showMessageBox(`'${filename}' has been prepared for download.`);
        } catch (error) {
          console.error("Error writing text file:", error);
          showMessageBox(
            "Failed to prepare file for download. Please try again."
          );
        }
      }

      // Display the string content in the HTML
      window.onload = function () {
        document.getElementById("stringContentDisplay").textContent =
          fileContent;
        // Attach the event listener to the button
        document
          .getElementById("writeTextFileBtn")
          .addEventListener("click", writeTextFile);
      };

      // JavaScript code ends here
    </script>
  </body>
</html>
